name: 🚀 Deploy
# l'action deploy va etre executée après chaque push ou pull request sur les branches main et dev
on:
  push:
    branches:
      - develop
      - ope
  pull_request: {}

#permissions
permissions:
  actions: write
  contents: read

#les jobs chaque job correspond à une action
jobs:
  lint:
    name: ⬣ ESLint
    runs-on: ubuntu-latest
    steps:
      # arret si un 2 push est lancé
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3
      # - name: Setup Bun
      #   uses: oven-sh/setup-bun@v1
      # - name: Install dependencies
      #   run: bun install

      - name: ⎔ Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📥 Download deps
        uses: bahmutov/npm-install@v1

      - name: 🔬 Lint
        run: npm run lint

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install

      # - name: ⎔ Setup node
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: 18

      # - name: 📥 Download deps
      #   uses: bahmutov/npm-install@v1

      - name: 🔎 Type check
        run: bun run typecheck

  build:
    name: 🐳 build
    uses: ./.github/workflows/build.yml
    secrets: inherit
